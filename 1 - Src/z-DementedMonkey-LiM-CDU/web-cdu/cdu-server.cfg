# LiM CDU server. Edit with a text editor, then restart the server.
#
# httpPort   Browser page.
# simPort    Sim and browser websocket. The aircraft WEBSOCKETS page uses this port.
# relayIp    PC where SPAD is listening. 127.0.0.1 is this PC.
# relayPort  SPAD websocket. The hub connects out and sends the plane's messages.
#            Set relayPort=0 to turn the relay off.
# winCtrlPort  MobiFlight WinCtrl port. This is 8320. Set 0 to turn WinCtrl off.
#            Do not run MobiFlight Connector as the WinCtrl server while this is on.
# winCtrlExporter  auto follows the loaded aircraft and starts that screen reader.
#            off turns the readers off. Native planes use the in-sim WEBSOCKETS page
#            and do not need a reader.

httpPort=8126
simPort=8088
relayIp=127.0.0.1
relayPort=8089
winCtrlPort=8320
winCtrlExporter=auto
