<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATR MCDU</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="cdu-atr.css?v=20261020-exec" />
</head>
<body>
  <div class="app">
    <div class="unit" id="unit">
      <span class="fastener fastener-tl" aria-hidden="true"></span>
      <span class="fastener fastener-tr" aria-hidden="true"></span>
      <span class="fastener fastener-bl" aria-hidden="true"></span>
      <span class="fastener fastener-br" aria-hidden="true"></span>

      <header class="eyebrow">
        <span class="eyebrow-spacer" aria-hidden="true"></span>
        <div class="plate">ATR MCDU</div>
        <div class="side-wrap">
          <span id="status" class="status disconnected">NO LINK</span>
          <div class="side" role="group" aria-label="CDU side">
            <button type="button" id="side-capt" data-side="1" class="on">CPT</button>
            <button type="button" id="side-fo" data-side="2">FO</button>
            <button type="button" id="side-both" data-side="both">BOTH</button>
          </div>
        </div>
      </header>

      <div class="ann-row" aria-label="Annunciators">
        <div class="ann" data-ann="fail"><span>FAIL</span></div>
        <div class="ann" data-ann="msg"><span>MSG</span></div>
        <div class="ann" data-ann="pos"><span>POS</span></div>
        <div class="ann" data-ann="ofst"><span>OFST</span></div>
        <div class="ann spare"><span>SPARE</span></div>
        <div class="ann spare"><span>SPARE</span></div>
      </div>

      <div class="face">
        <div class="lsks left" aria-label="Left line select keys">
          <span></span><span></span>
          <button type="button" class="lsk" data-key="L1" aria-label="LSK 1L"></button>
          <span></span>
          <button type="button" class="lsk" data-key="L2" aria-label="LSK 2L"></button>
          <span></span>
          <button type="button" class="lsk" data-key="L3" aria-label="LSK 3L"></button>
          <span></span>
          <button type="button" class="lsk" data-key="L4" aria-label="LSK 4L"></button>
          <span></span>
          <button type="button" class="lsk" data-key="L5" aria-label="LSK 5L"></button>
          <span></span>
          <button type="button" class="lsk" data-key="L6" aria-label="LSK 6L"></button>
          <span></span>
        </div>

        <div class="screen-bezel">
          <div id="screen" class="screen" aria-label="MCDU screen"></div>
        </div>

        <div class="lsks right" aria-label="Right line select keys">
          <span></span><span></span>
          <button type="button" class="lsk" data-key="R1" aria-label="LSK 1R"></button>
          <span></span>
          <button type="button" class="lsk" data-key="R2" aria-label="LSK 2R"></button>
          <span></span>
          <button type="button" class="lsk" data-key="R3" aria-label="LSK 3R"></button>
          <span></span>
          <button type="button" class="lsk" data-key="R4" aria-label="LSK 4R"></button>
          <span></span>
          <button type="button" class="lsk" data-key="R5" aria-label="LSK 5R"></button>
          <span></span>
          <button type="button" class="lsk" data-key="R6" aria-label="LSK 6R"></button>
          <span></span>
        </div>
      </div>

      <!--
        Cockpit photo 10-col keypad:
          1  2  3 | □ PROG DATA VNAV MRK | BRT▲ BRT▼
          4  5  6 | A  B    C    D    E  | F    G
          7  8  9 | H  I    J    K    L  | M    N
          .  0  ± | O  P    Q    R    S  | T    U
             / SP | V  W    X    Y    Z  | CLR
        Circles: 1–9 . 0 +/-. Squares elsewhere. E/N/S/W = square + face ring.
        / under 0 · SP under +/- · V under O · CLR under T
      -->
      <div class="deck">
        <div class="fn1" aria-label="Mode keys">
          <button type="button" data-key="MENU">MENU</button>
          <button type="button" data-key="PREV">PREV</button>
          <button type="button" data-key="NEXT">NEXT</button>
          <button type="button" class="boxed" data-key="RMS">RMS</button>
          <button type="button" data-key="FPLN">FPLN</button>
          <button type="button" data-key="DTO">DTO</button>
          <button type="button" data-key="PERF">PERF</button>
          <button type="button" data-key="MSG">MSG</button>
          <button type="button" id="exec-key" class="exec" data-key="EXEC"><span class="lamp" aria-hidden="true"></span>EXEC</button>
        </div>

        <div class="keys" aria-label="Keypad">
          <!-- row 1 -->
          <button type="button" class="round" data-key="1">1</button>
          <button type="button" class="round" data-key="2">2</button>
          <button type="button" class="round" data-key="3">3</button>
          <span class="key-blank key-blank-face" aria-hidden="true"></span>
          <button type="button" data-key="PROG">PROG</button>
          <button type="button" data-key="DATA">DATA</button>
          <button type="button" data-key="VNAV">VNAV</button>
          <button type="button" data-key="MRK">MRK</button>
          <button type="button" class="brt" data-key="BRT_UP" aria-label="Brightness up">
            <span class="brt-arr" aria-hidden="true">▲</span>
            <span class="brt-lbl">BRT</span>
          </button>
          <button type="button" class="brt" data-key="BRT_DN" aria-label="Brightness down">
            <span class="brt-lbl">BRT</span>
            <span class="brt-arr" aria-hidden="true">▼</span>
          </button>

          <!-- row 2 -->
          <button type="button" class="round" data-key="4">4</button>
          <button type="button" class="round" data-key="5">5</button>
          <button type="button" class="round" data-key="6">6</button>
          <button type="button" data-key="A">A</button>
          <button type="button" data-key="B">B</button>
          <button type="button" data-key="C">C</button>
          <button type="button" data-key="D">D</button>
          <button type="button" class="cardinal" data-key="E"><span>E</span></button>
          <button type="button" data-key="F">F</button>
          <button type="button" data-key="G">G</button>

          <!-- row 3 -->
          <button type="button" class="round" data-key="7">7</button>
          <button type="button" class="round" data-key="8">8</button>
          <button type="button" class="round" data-key="9">9</button>
          <button type="button" data-key="H">H</button>
          <button type="button" data-key="I">I</button>
          <button type="button" data-key="J">J</button>
          <button type="button" data-key="K">K</button>
          <button type="button" data-key="L">L</button>
          <button type="button" data-key="M">M</button>
          <button type="button" class="cardinal" data-key="N"><span>N</span></button>

          <!-- row 4 -->
          <button type="button" class="round" data-key="DOT" aria-label="Decimal">.</button>
          <button type="button" class="round" data-key="0">0</button>
          <button type="button" class="round pm" data-key="PLUSMINUS" aria-label="Plus minus"><span>+</span><span>−</span></button>
          <button type="button" data-key="O">O</button>
          <button type="button" data-key="P">P</button>
          <button type="button" data-key="Q">Q</button>
          <button type="button" data-key="R">R</button>
          <button type="button" class="cardinal" data-key="S"><span>S</span></button>
          <button type="button" data-key="T">T</button>
          <button type="button" data-key="U">U</button>

          <!-- row 5: gap under . · / under 0 · SP under +/- · V under O · CLR under T -->
          <span class="key-blank" aria-hidden="true"></span>
          <button type="button" data-key="SLASH">/</button>
          <button type="button" data-key="SP">SP</button>
          <button type="button" data-key="V">V</button>
          <button type="button" class="cardinal" data-key="W"><span>W</span></button>
          <button type="button" data-key="X">X</button>
          <button type="button" data-key="Y">Y</button>
          <button type="button" data-key="Z">Z</button>
          <button type="button" class="clr" data-key="CLR">CLR</button>
          <span class="key-blank" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>

  <script>window.LIM_WS_PORT = Number("__LIM_WS_PORT__") || 8088;</script>
  <script src="lim-route.js?v=20261021-777"></script>
  <script src="cdu-atr.js?v=20261020-exec"></script>
</body>
</html>
